# Builds LiteDoge on GitHub's build machines:
#   - quick-check   Linux build against Ubuntu's own libraries (fast compile check,
#                   also provides the litedoged used by the sync test)
#   - sync-test     runs that litedoged on the real LDOGE network for a while and
#                   reports how far it got and whether any block was rejected
#   - linux-gui     release Linux binaries (litedoge-qt, litedoged, litedoge-cli),
#                   libraries built from depends/ and linked in
#   - windows-gui   release Windows binaries (litedoge-qt.exe, litedoged.exe,
#                   litedoge-cli.exe), cross-compiled, statically linked
#
# Every push keeps the binaries as downloadable "artifacts" on the run's page.
# Pushing a version tag (e.g. v3.6.0.2) also publishes them as a GitHub release.

name: Build

on:
  push:
    branches: [ main, modern ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md', 'doc/**' ]
  pull_request:
    paths-ignore: [ '**.md', 'doc/**' ]
  workflow_dispatch:

# Each push gets its own run (an older run keeps going, so the cached
# libraries it is building are not lost)
concurrency:
  group: build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1G
  # Libraries we don't use: ZeroMQ notifications, tracing, multiprocess
  DEPENDS_OPTS: NO_ZMQ=1 NO_USDT=1 NO_MULTIPROCESS=1
  CONFIGURE_OPTS: --disable-tests --disable-bench --disable-fuzz-binary --enable-reduce-exports --with-gui=qt5

jobs:
  quick-check:
    name: Quick Linux build (system libraries)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 ccache libevent-dev libboost-dev libsqlite3-dev libdb5.3++-dev \
            libminiupnpc-dev libnatpmp-dev libssl-dev qtbase5-dev qttools5-dev qttools5-dev-tools \
            libqrencode-dev

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-quick-${{ github.sha }}
          restore-keys: ccache-quick-

      - name: Build
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          ./autogen.sh
          ./configure --with-incompatible-bdb --disable-bench --disable-fuzz-binary --with-gui=qt5 \
            --enable-werror=no CXXFLAGS="-O2 -g0"
          make -j"$(nproc)" -k 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0 || { echo "::group::Errors"; grep -n -B2 -A6 'error:' build.log | head -300; echo "::endgroup::"; exit 1; }
          ccache -s

      - name: Unit tests
        continue-on-error: true
        run: |
          timeout 1200 make -j"$(nproc)" check VERBOSE=1 2>&1 | tail -n 200

      - name: Check the binaries
        run: |
          ./src/litedoged -version | head -n 3
          ./src/litedoge-cli -version | head -n 1

      - uses: actions/upload-artifact@v4
        with:
          name: quick-check-litedoged
          path: |
            src/litedoged
            src/litedoge-cli

  sync-test:
    name: Mainnet sync test
    needs: quick-check
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: contrib/ci

      - uses: actions/download-artifact@v4
        with:
          name: quick-check-litedoged
          path: bin

      - name: Sync from the LDOGE network
        run: |
          for i in 1 2 3; do
            sudo apt-get update >/dev/null && sudo apt-get install -y libevent-dev libboost-dev libsqlite3-dev libdb5.3++-dev libminiupnpc-dev libnatpmp-dev >/dev/null && break
            sleep 20
          done
          chmod +x bin/*
          SYNC_MINUTES=55 contrib/ci/sync-test.sh bin

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-test-debug-log
          path: sync-test/*.log

  linux-gui:
    name: Linux release (depends)
    runs-on: ubuntu-22.04
    env:
      HOST: x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 curl cmake ccache bison

      # The libraries take ~40 minutes to build, so they are cached as soon as
      # they are built (not only when the whole job succeeds)
      - uses: actions/cache/restore@v4
        id: depends
        with:
          path: |
            depends/built
            depends/sources
          key: depends-${{ env.HOST }}-${{ hashFiles('depends/packages/**', 'depends/patches/**', 'depends/hosts/**', 'depends/builders/**', 'depends/Makefile', 'depends/funcs.mk') }}

      - name: Build libraries (depends)
        run: make -C depends HOST=$HOST -j"$(nproc)" $DEPENDS_OPTS

      - uses: actions/cache/save@v4
        if: steps.depends.outputs.cache-hit != 'true'
        with:
          path: |
            depends/built
            depends/sources
          key: ${{ steps.depends.outputs.cache-primary-key }}

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Build
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/$HOST/share/config.site" ./configure $CONFIGURE_OPTS \
            LDFLAGS="-static-libstdc++ -static-libgcc"
          make -j"$(nproc)"
          mkdir -p out
          cp src/litedoged src/litedoge-cli src/qt/litedoge-qt out/
          strip out/*
          ccache -s

      - name: Check the binaries
        run: |
          file out/*
          ldd out/litedoge-qt
          ./out/litedoged -version | head -n 1

      - uses: actions/upload-artifact@v4
        with:
          name: litedoge-linux-x86_64
          path: out/

      # Run the wallet on a virtual display and screenshot each page, so GUI
      # changes can be reviewed from the run's artifacts
      - name: Take GUI screenshots
        continue-on-error: true
        run: |
          sudo apt-get install -y gdb xvfb xdotool imagemagick libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libfontconfig1
          PRINT_SCREENSHOTS_BASE64=1 contrib/ci/gui-screenshots.sh ./out/litedoge-qt screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots-linux
          path: screenshots/
          if-no-files-found: ignore

  windows-gui:
    name: Windows release (depends, cross-compiled)
    runs-on: ubuntu-22.04
    env:
      HOST: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 curl cmake ccache bison g++-mingw-w64-x86-64-posix nsis zip
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      # The libraries take ~40 minutes to build, so they are cached as soon as
      # they are built (not only when the whole job succeeds)
      - uses: actions/cache/restore@v4
        id: depends
        with:
          path: |
            depends/built
            depends/sources
          key: depends-${{ env.HOST }}-${{ hashFiles('depends/packages/**', 'depends/patches/**', 'depends/hosts/**', 'depends/builders/**', 'depends/Makefile', 'depends/funcs.mk') }}

      - name: Build libraries (depends)
        run: make -C depends HOST=$HOST -j"$(nproc)" $DEPENDS_OPTS

      - uses: actions/cache/save@v4
        if: steps.depends.outputs.cache-hit != 'true'
        with:
          path: |
            depends/built
            depends/sources
          key: ${{ steps.depends.outputs.cache-primary-key }}

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Build
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/$HOST/share/config.site" ./configure $CONFIGURE_OPTS
          make -j"$(nproc)"
          mkdir -p out
          cp src/litedoged.exe src/litedoge-cli.exe src/qt/litedoge-qt.exe out/
          x86_64-w64-mingw32-strip out/*.exe
          ccache -s

      - name: Check the .exe files only need Windows' own DLLs
        run: |
          file out/*
          for f in out/*.exe; do
            echo "== $f"
            x86_64-w64-mingw32-objdump -p "$f" | grep 'DLL Name' | sort -u
          done

      - uses: actions/upload-artifact@v4
        with:
          name: litedoge-windows-x86_64
          path: out/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux-gui, windows-gui ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          cd dist
          tar -czf "litedoge-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C litedoge-linux-x86_64 .
          (cd litedoge-windows-x86_64 && zip -9 "../litedoge-${GITHUB_REF_NAME}-win64.zip" *.exe)
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
